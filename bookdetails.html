<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="p-20">
      <div class="grid grid-cols-2 gap-4">
        <div>
          <img
            src="C:\Users\BS00956\OneDrive - Brain Station 23\Desktop\BS1813 Dev\library-management-system\book_image.webp"
            alt=""
            class=""
          />
        </div>
        <div>
          <h1>ব্যাবহারিক তথ্য ও যোগাযোগ প্রযুক্তি : একাদশ-দ্বাদশ শ্রেণি</h1>
          <h2>লেখক : Me</h2>
          <button
            type="button"
            class="bg-red-500 hover:bg-white rounded border-2 border-red-500 text-black font-bold py-2 px-40 items-center"
          >
            Download PDF Version
          </button>
        </div>
      </div>
      <div class="mt-4">
        <button
          type="button"
          class="bg-red-500 hover:bg-white rounded border-2 border-red-500 text-black font-bold py-2 px-6 items-center text-center ml-40"
        >
          Reviews
        </button>
          <div class="border-2 bg-gray-300 px-4 py-4 mx-auto mt-4">
            <form>
              <input
                type="text"
                class="border-2 border-gray-300 rounded px-4 py-2 w-full"
                placeholder="Your name..."
                id="reviewerName"
                required
              />

              <input
                type="text"
                class="mt-4 border-2 border-gray-300 rounded px-4 py-2 w-full"
                placeholder="Write a review..."
                id="reviewText"
                required
              />
            <button
                type="submit"
                class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded w-full"
                > 
                Submit
            </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
