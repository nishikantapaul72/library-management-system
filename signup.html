<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-white rounded-lg shadow-lg p-8 w-full max-w-md">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold text-gray-800">Sign Up</h2>
        <a href="index.html" class="text-gray-500 hover:text-gray-700">
          <svg
            class="w-6 h-6"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            ></path>
          </svg>
        </a>
      </div>

      <form class="space-y-4">
        <div>
          <label class="block text-gray-700 mb-1">Full Name</label>
          <input
            type="text"
            class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
            placeholder="Enter your full name"
          />
        </div>
        <div>
          <label class="block text-gray-700 mb-1">Email</label>
          <input
            type="email"
            class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
            placeholder="Enter your email"
          />
        </div>
        <div>
          <label class="block text-gray-700 mb-1">Password</label>
          <input
            type="password"
            class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
            placeholder="Create a password"
          />
        </div>
        <div>
          <label class="block text-gray-700 mb-1">Confirm Password</label>
          <input
            type="password"
            class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
            placeholder="Confirm your password"
          />
        </div>
        <div class="flex items-center">
          <input type="checkbox" class="rounded text-blue-600" />
          <span class="ml-2 text-sm text-gray-600"
            >I agree to the
            <a href="#" class="text-blue-600 hover:underline"
              >Terms of Service</a
            >
            and
            <a href="#" class="text-blue-600 hover:underline"
              >Privacy Policy</a
            ></span
          >
        </div>
        <button
          type="submit"
          class="w-full bg-blue-600 text-white py-2 rounded font-semibold hover:bg-blue-700 transition-all"
        >
          Sign Up
        </button>
        <div class="text-center text-sm text-gray-600 mt-4">
          Already have an account?
          <a href="login.html" class="text-blue-600 hover:underline">Log in</a>
        </div>
      </form>
    </div>
  </body>
</html>
